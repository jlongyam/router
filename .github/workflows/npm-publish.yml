# Runs the tests, then publishes the package to npm when a GitHub release is published.
# Docs: https://docs.github.com/en/actions/publishing-packages/publishing-nodejs-packages
#
# Requirements before this can succeed:
#   1. NPM_TOKEN must be reachable by the publishing job. It currently lives as an
#      environment secret in the "npm_token" environment, so that job declares
#      `environment: npm_token` below -- environment secrets are invisible to jobs
#      that do not declare the environment, even when the name matches.
#      The token needs publish rights for the @jlbyte scope: an npm Automation token,
#      or a Granular token with "Bypass 2FA" (CI cannot answer a 2FA prompt).
#   2. The release tag must contain this workflow file (see the note at the bottom).

name: Node.js Package

on:
  release:
    types: [published]
  # Manual trigger, so the workflow can be tested without cutting a new release.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  publish-npm:
    needs: build
    runs-on: ubuntu-latest
    # Required: without this, the environment secret NPM_TOKEN is not exposed to the job.
    environment: npm_token
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org/
      - run: pnpm install --frozen-lockfile
      # --access public is required: scoped packages (@jlbyte/...) default to
      # "restricted", which fails for accounts without a paid private-packages plan.
      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

# Note: a release-triggered run uses the workflow file from the released ref, so a
# tag created before this file existed will never produce a run. Publish a release
# whose tag is cut from a commit that already contains this file.
