<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Router</title>
</head>

<body>
  <ul>
    <li><a href="./index.html">Index</a></li>
    <li><a href="#home">Home</a></li>
  </ul>
  <pre id="pre"></pre>
  <script type="module">
    import { Router } from './router.js';
    const router = new Router();

    router.route(':page', ({ params, query }) => {
      if(params.page === 'home') {
        pre.textContent = 'Welcome at Home'
      }
    })
  </script>
</body>

</html>
